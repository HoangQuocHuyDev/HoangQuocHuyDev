<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-label="Animated Anonymous-inspired holographic mask with red and blue scanning laser">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070c15"/><stop offset=".5" stop-color="#0c1424"/><stop offset="1" stop-color="#070b13"/></linearGradient>
  <linearGradient id="mask" x2="1"><stop stop-color="#ff536f"/><stop offset=".49" stop-color="#b5c4e1"/><stop offset=".51" stop-color="#d8eaff"/><stop offset="1" stop-color="#48aeff"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5cf6ff" stop-opacity="0"/><stop offset=".85" stop-color="#5cf6ff" stop-opacity=".08"/><stop offset="1" stop-color="#78faff" stop-opacity=".65"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#164a6e" stop-opacity=".4"/><stop offset="1" stop-color="#164a6e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26384d" stroke-width=".65"/></pattern>
  <clipPath id="screen"><rect x="24" y="62" width="1052" height="391" rx="8"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1100" height="480" rx="16" fill="url(#bg)"/>
<rect width="1100" height="480" rx="16" fill="url(#grid)" opacity=".45"/>
<rect x="12" y="12" width="1076" height="456" rx="12" fill="none" stroke="#31526a" stroke-width="2"/>
<path d="M24 12H545" stroke="#ff526f" stroke-width="3"/><path d="M555 12H1076" stroke="#48aeff" stroke-width="3"/>
<circle cx="42" cy="38" r="6" fill="#ff526f"/><circle cx="62" cy="38" r="6" fill="#ffce66"/><circle cx="82" cy="38" r="6" fill="#4fe6b1"/>
<g font-family="monospace" font-size="13"><text x="105" y="43" fill="#d2dbe8">ANONYMOUS // IDENTITY SCAN</text><text x="1057" y="43" fill="#68b8f6" text-anchor="end">CYBER OPS • VISUAL SIMULATION</text></g>
<g clip-path="url(#screen)">
<ellipse cx="525" cy="245" rx="280" ry="215" fill="url(#halo)"/>
<g fill="none" stroke="#356c93" opacity=".65">
<circle cx="525" cy="255" r="178" stroke-dasharray="8 13"><animateTransform attributeName="transform" type="rotate" from="0 525 255" to="360 525 255" dur="24s" repeatCount="indefinite"/></circle>
<circle cx="525" cy="255" r="197" stroke-dasharray="2 18"><animateTransform attributeName="transform" type="rotate" from="360 525 255" to="0 525 255" dur="19s" repeatCount="indefinite"/></circle>
<path d="M525 52V81 M525 427V456 M322 255H352 M698 255H728" stroke="#5ad7ff" stroke-width="2"/>
</g>
<!-- Anonymous-inspired theatrical mask: brows, long nose, stylized moustache and goatee -->
<g transform="translate(525 258)">
  <path d="M0 -155 C-65 -154 -119 -115 -123 -43 C-128 21 -108 102 -64 133 C-38 153 -15 164 0 167 C15 164 38 153 64 133 C108 102 128 21 123 -43 C119 -115 65 -154 0 -155Z" fill="#0d1d2d" stroke="url(#mask)" stroke-width="3.4"/>
  <path d="M-104 -75 Q-68 -122 -17 -93 M104 -75 Q68 -122 17 -93" fill="none" stroke="url(#mask)" stroke-width="10" stroke-linecap="round"/>
  <path d="M-99 -49 Q-62 -75 -19 -46 Q-48 -13 -90 -33Z M99 -49 Q62 -75 19 -46 Q48 -13 90 -33Z" fill="#02070f" stroke="url(#mask)" stroke-width="3"/>
  <path d="M-72 -43 Q-55 -35 -36 -43 M72 -43 Q55 -35 36 -43" fill="none" stroke="#8be9ff" stroke-width="3" opacity=".8"/>
  <path d="M-10 -73 Q-28 0 -18 22 Q0 36 18 22 Q28 0 10 -73" fill="#12283b" stroke="url(#mask)" stroke-width="2.5"/>
  <path d="M-88 32 Q-57 25 -20 40 Q-7 48 0 47 Q7 48 20 40 Q57 25 88 32 Q65 57 25 59 Q10 57 0 51 Q-10 57 -25 59 Q-65 57 -88 32Z" fill="url(#mask)" opacity=".88"/>
  <path d="M-48 84 Q0 101 48 84 Q34 113 0 117 Q-34 113 -48 84Z" fill="#050b16" stroke="url(#mask)" stroke-width="2.4"/>
  <path d="M-20 119 L0 155 L20 119 Q0 132 -20 119Z" fill="url(#mask)"/>
  <path d="M-108 -2 Q-114 79 -57 128 M108 -2 Q114 79 57 128" stroke="url(#mask)" stroke-width="2" opacity=".5" fill="none"/>
  <animate attributeName="opacity" values="1;1;.87;1;1" keyTimes="0;.46;.48;.5;1" dur="8s" repeatCount="indefinite"/>
</g>
<!-- Scanning line and glow -->
<rect x="24" y="-35" width="1052" height="72" fill="url(#beam)" opacity=".8"><animate attributeName="y" values="-60;470;-60" dur="5.4s" repeatCount="indefinite"/></rect>
<path d="M24 0H1076" stroke="#6bfaff" stroke-width="2" opacity=".85" filter="url(#glow)"><animate attributeName="d" values="M24 62H1076;M24 449H1076;M24 62H1076" dur="5.4s" repeatCount="indefinite"/></path>
<path d="M24 0H1076" stroke="#9bffff" stroke-width="1.5" opacity=".85"><animate attributeName="d" values="M24 62H1076;M24 449H1076;M24 62H1076" dur="5.4s" repeatCount="indefinite"/></path>
</g>
<g font-family="monospace" font-size="15">
<text x="55" y="112" fill="#ff6b82">[ RED TEAM ]</text>
<text x="55" y="144" fill="#b7c6d8">RECON / ANALYSIS</text>
<text x="55" y="177" fill="#6a839c">MODE: LEARNING</text>
<text x="55" y="404" fill="#ff6b82">01 // OFFENSE</text>
<text x="825" y="112" fill="#64bdff">[ BLUE TEAM ]</text>
<text x="825" y="144" fill="#b7c6d8">DETECT / DEFEND</text>
<text x="825" y="177" fill="#6a839c">MODE: LEARNING</text>
<text x="825" y="404" fill="#64bdff">02 // DEFENSE</text>
<text x="55" y="435" fill="#53e9bd">SCAN ACTIVE <tspan>▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
<text x="1047" y="435" fill="#8b9eb5" text-anchor="end">HOANGQUOCHUYDEV // 2026</text>
</g>
</svg>